<!DOCTYPE html>
<html>
<head>
    <title>Predict Math Score</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #444; font-weight: bold; font-size: 14px; }
        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            color: #333;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #2c3e50;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #1a252f; }
        .result {
            margin-top: 24px;
            padding: 20px;
            background-color: #eafaf1;
            border-left: 4px solid #27ae60;
            border-radius: 6px;
            text-align: center;
            font-size: 20px;
            color: #2c3e50;
        }
        .back { display: block; text-align: center; margin-top: 16px; color: #666; text-decoration: none; font-size: 14px; }
        .back:hover { color: #2c3e50; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter Student Details</h2>
        <form action="/predictdata" method="post">

            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Race / Ethnicity</label>
                <select name="ethnicity">
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="form-group">
                <label>Parental Level of Education</label>
                <select name="parental_level_of_education">
                    <option value="some high school">Some High School</option>
                    <option value="high school">High School</option>
                    <option value="some college">Some College</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="master's degree">Master's Degree</option>
                </select>
            </div>

            <div class="form-group">
                <label>Lunch Type</label>
                <select name="lunch">
                    <option value="standard">Standard</option>
                    <option value="free/reduced">Free / Reduced</option>
                </select>
            </div>

            <div class="form-group">
                <label>Test Preparation Course</label>
                <select name="test_preparation_course">
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="form-group">
                <label>Reading Score (0 - 100)</label>
                <input type="number" name="reading_score" min="0" max="100" placeholder="e.g. 72" required>
            </div>

            <div class="form-group">
                <label>Writing Score (0 - 100)</label>
                <input type="number" name="writing_score" min="0" max="100" placeholder="e.g. 68" required>
            </div>

            <button type="submit">Predict Math Score</button>
        </form>

        {% if results is defined and results != None %}
        <div class="result">
            Predicted Math Score: <strong>{{ results }}</strong>
        </div>
        {% endif %}

        <a href="/" class="back">← Back to Home</a>
    </div>
</body>
</html>
