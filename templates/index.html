<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Indicator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 60px 80px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        a {
            background-color: #2c3e50;
            color: white;
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }
        a:hover { background-color: #1a252f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Math Score Predictor</h1>
        <p>Enter student details to predict their math score</p>
        <a href="/predictdata">Predict Now</a>
    </div>
</body>
</html>
